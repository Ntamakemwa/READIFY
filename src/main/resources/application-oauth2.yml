spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid, email, profile
            redirect-uri: ${READIFY_BASE_URL:http://localhost:8081}/api/v1/auth/oauth2/callback/google
            client-name: Google
            client-authentication-method: basic
            authorization-grant-type: authorization_code
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: email
  # Email configuration
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
        debug: false

# Readify OAuth2 settings
readify:
  oauth2:
    redirect-uri: ${READIFY_BASE_URL:http://localhost:8081}/api/v1/auth/oauth2/callback/google
    email-verification:
      expiry-hours: 24
      base-url: ${READIFY_BASE_URL:http://localhost:8081}
